name: Update prime rate

on:
  schedule:
    - cron: '17 13 * * 1-5'   # weekdays, after the Fed publishes H.15 data
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: node scripts/update-prime.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet prime-rate.json; then
            echo "No change"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
            git add prime-rate.json
            git commit -m "Update prime rate"
            git push
          fi
